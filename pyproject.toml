  [project]
  name = "mbta-analytics-pipeline"
  version = "0.1.0"
  requires-python = ">=3.14,<3.15"
  dependencies = ["duckdb", "pyarrow"]

  [build-system]
  requires = ["pdm-backend"]
  build-backend = "pdm.backend"

  [tool.pdm]
  distribution = true

  [tool.pdm.scripts]
  trace-batch = "python -m mbta_pipeline.trace_batch"
